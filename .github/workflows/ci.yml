name: ci
on:
  push: { branches: [main] }
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      # No install step: the harness has zero dependencies, by design.
      - run: node test/harness.test.mjs
      - run: node test/usage-gate.stress.mjs
